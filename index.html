function calc(s){if(backendEvaluations[s.id]){const x=backendEvaluations[s.id];return{p:x.p,cost:x.cost,gain:x.gain,net:x.net,sup:x.sup,econ:x.econ};}let f=s.finance;let p=Number(f.p_technical||0)*Number(f.p_on_time||0)*Number(f.p_sustain||0);let cost=['cost_experts','cost_travel','cost_testing','cost_tooling','cost_incentives'].reduce((a,k)=>a+Number(f[k]||0),0);let gain=Number(f.gain||0),net=gain*p-cost;let sup=Number(f.supplier_contribution||0)+Number(f.retained_savings||0)+Number(f.productivity_relief||0)+Number(f.other_customer_upside||0)-Number(f.supplier_capex||0)-Number(f.supplier_opex||0);return{p,cost,gain,net,sup,econ:net>0}};
function domainStats(s,k){const a=D.criteria.filter(x=>x.code.startsWith(k)).map(x=>s.ratings[x.code]).filter(v=>v!=null&&v!==''&&Number.isFinite(+v));return{n:a.length,total:D.criteria.filter(x=>x.code.startsWith(k)).length,avg:a.length?a.reduce((u,v)=>u+Number(v),0)/a.length:null}}
function coverage(s){let rated=Object.values(s.ratings||{}).filter(x=>x!=null&&x!=='').length;return{rated,total:D.criteria.length,rate:rated/D.criteria.length}}
function missing(s){return D.criteria.filter(x=>s.ratings[x.code]==null).map(x=>x.code)}
function weak(s){return D.criteria.filter(x=>s.ratings[x.code]!=null&&Number(s.ratings[x.code])<3.1).sort((a,b)=>Number(s.ratings[a.code])-Number(s.ratings[b.code]))}
function interventionMatches(s){if(backendEvaluations[s.id]?.recommendations?.length){return backendEvaluations[s.id].recommendations.map(i=>({...i,keys:i.criteria_list}));}const gaps=new Set([...weak(s).map(x=>x.code),...(s.criteria||[])]);return D.interventions.map(i=>{let keys=i.criteria.split(';').map(x=>x.trim());let overlap=keys.filter(k=>gaps.has(k)),knownWeak=keys.filter(k=>s.ratings[k]!=null&&Number(s.ratings[k])<3.1);return{...i,keys,overlap,points:knownWeak.length*4+overlap.length*2+(s.selected||[]).includes(i.id)}}).sort((a,b)=>b.points-a.points)}
const scoreColor=v=>v===null?'muted':v>=3.1?'green':'amber';
function scoreTag(v){return v==null?tag('Not assessed','line'):tag(v.toFixed(2)+' / 5',scoreColor(v))}

function subHero(kicker,title,desc){return `<section class="page-hero"><div class="container"><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div></section>`}
function solutions(){return `<main>${subHero('WORKSPACE FUNCTIONS','Supplier development tasks','Use these tools to assess capability, review interventions, check feasibility and track the engagement.')}

['01 / CAPABILITY','Assess capability','Record ratings and supporting evidence across the 16 capability criteria.','Missing evidence remains unassessed, not zero.','assessment'],
['02 / INTERVENTIONS','Review intervention options','Filter the 21 intervention candidates by the supplier’s assessed gaps.','Check scope, assumptions and source limitations before selection.','interventions'],
['03 / BUSINESS VALUE','Review the business case','Calculate expected Siemens value and supplier costs or incentives using editable assumptions.','The four feasibility checks remain separate from the financial estimate.','economics'],

function approach(){const descriptions=['Define the demand, risk or performance trigger; establish criticality and owner.','Compare expected requirements to observed capability; keep unknowns explicit.','Find evidence-backed improvement candidates that match the supplier context.','Check technical closure, schedule, Siemens economics and supplier willingness.','Agree actions, business incentives, responsibilities and review milestones.','Deliver support with supplier ownership and record deviations.','Measure actual improvement against the agreed baseline.','Document sustained outcomes, lessons and next review.'];return `<main>${subHero('ENGAGEMENT PROCESS','Eight stages of supplier development','Use the stage record to document the requirement, diagnosis, intervention, feasibility review, implementation and results.')}
<section class="section alt"><div class="container"><div class="numbered">${stageNames.map((t,i)=>`<article class="numbered-item ${i===2||i===3?'highlight':''}"><div class="num">${i+1}</div><div><span class="kicker">${i===2||i===3?'PRIORITY DECISION STAGE':'ENGAGEMENT STAGE'}</span><h3>${t}</h3><p>${descriptions[i]}</p></div></article>`).join('')}</div><div class="action-row" style="margin-top:26px">${mkBtn('Run an engagement','workspace/workflow')}</div></div></section><section class="section"><div class="container"><div class="section-head"><div class="eyebrow">ASSESSMENT CONTROLS</div><h2>Benchmark interpretation</h2><p>A score of 3.1 or higher is a maturity reference, not approval for a particular supplier requirement.</p></div><div class="two-grid"><div class="feature-box"><h3>Missing evidence</h3><p>Unanswered criteria remain “not assessed.” Review critical criteria individually as well as domain averages.</p></div><div class="feature-box"><h3>Required reviews</h3><p>Confirm diagnosis, intervention selection, feasibility and measured results at the relevant stage.</p></div></div></div></section></main>`}

function workspace(tab){let s=c(),finance=calc(s),cv=coverage(s);let tabs=ids.map(id=>`<button class="work-tab ${tab===id?'active':''}" data-go="workspace/${id}">${tabLabels[id]}</button>`).join('');return `<main class="work-bg"><div class="container workspace-main"><div class="work-top"><div><div class="eyebrow">SUPPLIER WORKSPACE / DECISION SUPPORT</div><h1>${esc(s.name)}</h1><p>${esc(s.type)} supplier · ${esc(s.sector)} · ${esc(s.country)} · ${esc(s.id)}</p></div><div class="work-actions"><select id="supplier-select" class="selector" aria-label="Choose supplier">${state.cases.map(x=>`<option value="${esc(x.id)}" ${x.id===s.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button class="btn btn-outline btn-small" data-action="export">Export case ↓</button><a class="btn btn-outline btn-small" href="/api/export" download>Backup session ↓</a><label class="btn btn-outline btn-small" for="restore-session-file">Restore ↑</label><input type="file" id="restore-session-file" accept=".json,application/json" style="display:none" aria-label="Restore session JSON"></div></div><nav class="work-nav" aria-label="Workspace sections">${tabs}</nav>${routeWorkspace(tab,s,finance,cv)}<div class="disclosure">Demonstration with synthetic supplier cases. Scores, recommendations, financial values and Snowflake records are illustrative, not validated Siemens decisions. Changes are saved to the session on the Python server. On free hosting, sessions may reset when the service restarts; export a backup before important demos.</div></div></main>`}
function routeWorkspace(tab,s,fin,cv){switch(tab){case'overview':return overview(s,fin,cv);case'assessment':return assessment(s);case'compare':return compare();case'interventions':return interventions(s);case'economics':return economics(s,fin);case'workflow':return workflow(s);case'questionnaire':return questionnaire(s);case'data':return dataView(s);case'copilot':return copilot(s);default:return overview(s,fin,cv)}}
function metrics(s,fin,cv){const gates=[s.finance.tech_ok,s.finance.timing_ok,fin.econ,s.finance.supplier_willing==='Yes'].filter(Boolean).length;return `<div class="data-grid"><div class="metric"><div class="metric-label">Assessment coverage</div><div class="metric-value">${pct(cv.rate)}</div><div class="metric-note">${cv.rated} of ${cv.total} criteria assessed</div></div><div class="metric"><div class="metric-label">Feasibility gates</div><div class="metric-value">${gates} <span style="font-size:14px;color:#7e94a5">/ 4</span></div><div class="metric-note">Requires human validation</div></div><div class="metric"><div class="metric-label">Expected net value</div><div class="metric-value">${compact(fin.net)}</div><div class="metric-note">Probability-weighted, illustrative</div></div><div class="metric"><div class="metric-label">Evidence gaps</div><div class="metric-value">${missing(s).length}</div><div class="metric-note">Not assessed, not zero</div></div></div>`}
function domainLines(s){return doms.map(d=>{let a=domainStats(s,d.key);return `<div class="domain-line"><span class="domain-name">${d.name}</span><div class="bartrack"><div class="barfill" style="width:${a.avg!=null?Math.max(0,Math.min(100,a.avg/5*100)):0}%"></div><i class="benchmark-mark" title="3.1 benchmark reference"></i></div><div class="domain-val">${a.avg==null?'N/E':a.avg.toFixed(2)+'/5'}</div></div>`}).join('')}
function overview(s,fin,cv){let ints=interventionMatches(s);let first=ints[0];let g=weak(s).slice(0,4);const gates=[s.finance.tech_ok,s.finance.timing_ok,fin.econ,s.finance.supplier_willing==='Yes'].filter(Boolean).length;return `${metrics(s,fin,cv)}<div class="cols-2"><section class="panel"><div class="panel-head"><div><h2>Capability at a glance</h2><p>Readiness measured against 16 distinct criteria.</p></div>${tag('Reference: 3.1 / 5','line')}</div>${domainLines(s)}<div class="divider"></div><div class="subtle-head">Priority evidence and gaps</div><p class="small" style="color:#5a7489">${esc(s.gap)}</p><div class="action-row">${g.length?g.map(x=>tag(x.code+' · '+Number(s.ratings[x.code]).toFixed(1),'amber')).join(''):tag('No demonstrated low-scoring criteria','green')}${missing(s).length?tag(missing(s).length+' unknown','line'):''}</div><div class="action-row">${mkBtn('Review assessment','workspace/assessment','btn-outline')}</div></section>
<section class="panel"><div class="panel-head"><div><h2>The next decision</h2><p>Review the recommendation and approval status.</p></div>${tag(gates===4?'Gates to review':'Evidence pending',gates===4?'blue':'amber')}</div><span class="kicker">RECOMMENDED INTERVENTION LEAD</span><h3 style="font-size:21px;margin:8px 0 12px">${first?esc(first.name):'Further diagnostic assessment needed'}</h3><p class="small muted">${first?esc(first.mechanism):'Insufficient criteria for automatic matching.'}</p><div class="alertbox" style="margin-top:20px"><h4>Decision required</h4><p>${s.diagnosis_approved?'Validate feasibility and gain supplier commitment before confirming scope.':'Confirm the diagnosis and missing evidence before selecting a final intervention.'}</p></div><div class="action-row">${mkBtn('Review interventions','workspace/interventions')} ${mkBtn('Business case','workspace/economics','btn-outline')}</div></section></div>
<div class="cols-equal"><section class="panel"><div class="panel-head"><div><h2>Engagement context</h2><p>Business requirement and measured objective.</p></div></div><dl><div class="keyline"><dt>Trigger</dt><dd>${esc(s.trigger)}</dd></div><div class="keyline"><dt>Objective</dt><dd>${esc(s.objective)}</dd></div><div class="keyline"><dt>Target date</dt><dd>${esc(s.need_date)}</dd></div><div class="keyline"><dt>Current stage</dt><dd>${Math.max(1,Number(s.completed_stage||1)+1)} / 8</dd></div></dl></section><section class="panel"><div class="panel-head"><div><h2>Working with evidence</h2><p>Data sources and required checkpoints for this supplier.</p></div></div><div class="keyline"><dt>Supplier records</dt><dd>Four mock Snowflake subject areas</dd></div><div class="keyline"><dt>Benchmarks</dt><dd>${D.interventions.length} research-derived intervention candidates</dd></div><div class="keyline"><dt>Human checkpoints</dt><dd>Diagnosis, solution, feasibility and verification</dd></div><div class="keyline"><dt>Copilot</dt><dd>Integration architecture; not connected live</dd></div><div class="action-row">${mkBtn('View data architecture','workspace/data','btn-outline')}</div></section></div>`}
function assessment(s){let cv=coverage(s);return `<section class="panel"><div class="panel-head"><div><h2>Capability assessment</h2><p>Score each criterion on a 1–5 scale. “Not assessed” means missing evidence, never zero.</p></div>${tag(`${cv.rated} of ${cv.total} assessed`,'blue')}</div><div class="scores-layout">${doms.map(d=>`<div><span class="eyebrow">DOMAIN ${d.key}</span><h3 class="subtle-head" style="margin:8px 0 13px">${d.name}</h3>${D.criteria.filter(i=>i.code.startsWith(d.key)).map(k=>`<div class="score-row"><span class="crit-code">${k.code}</span><span class="crit-label" title="${esc(k.definition)}">${esc(k.name)}</span><select aria-label="Score ${k.code}" data-score="${k.code}"><option value="" ${s.ratings[k.code]==null?'selected':''}>Not assessed</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(s.ratings[k.code])===n?'selected':''}>${n}</option>`).join('')}${s.ratings[k.code]!=null&&!Number.isInteger(Number(s.ratings[k.code]))?`<option value="${s.ratings[k.code]}" selected>${s.ratings[k.code]} · baseline</option>`:''}</select></div>`).join('')}</div>`).join('')}</div><div class="divider"></div><div class="action-row">${mkBtn('Compare suppliers','workspace/compare')} ${mkBtn('Review suggested interventions','workspace/interventions','btn-outline')}<button class="btn btn-outline" data-action="resetScores">Reset scores for this supplier</button></div><p class="small muted" style="margin-top:13px">These criteria are distinct from the official 55-item supplier survey. No automatic 1:1 conversion is assumed.</p></section>`}
function compare(){const selected=state.compare.filter(id=>state.cases.some(c=>c.id===id)).slice(0,3);const comparison=selected.map(id=>state.cases.find(c=>c.id===id));return `<section class="panel"><div class="panel-head"><div><h2>Compare up to three suppliers</h2><p>Assess differences across the full criteria set, not just average maturity.</p></div>${tag(`${selected.length} selected`,'blue')}</div><div class="action-row" style="margin-bottom:20px">${state.cases.map(s=>`<label class="pill-check"><input type="checkbox" data-compare="${esc(s.id)}" ${selected.includes(s.id)?'checked':''} ${!selected.includes(s.id)&&selected.length>=3?'disabled':''}> ${esc(s.name)}</label>`).join('')}</div>${comparison.length?`<div class="table-wrap"><table><thead><tr><th style="min-width:210px">Capability measure</th>${comparison.map(s=>`<th style="min-width:165px">${esc(s.name)}</th>`).join('')}</tr></thead><tbody><tr><td><strong>Engagement type</strong></td>${comparison.map(s=>`<td>${esc(s.type)} · ${esc(s.country)}</td>`).join('')}</tr>${doms.map(d=>`<tr><td><strong>${d.name}</strong></td>${comparison.map(s=>`<td>${scoreTag(domainStats(s,d.key).avg)}</td>`).join('')}</tr>`).join('')}<tr><td><strong>Evidence coverage</strong></td>${comparison.map(s=>`<td>${pct(coverage(s).rate)}</td>`).join('')}</tr>${D.criteria.map(k=>`<tr><td><strong>${k.code}</strong> · ${esc(k.name)}</td>${comparison.map(s=>`<td>${s.ratings[k.code]==null?tag('Not assessed','line'):tag(Number(s.ratings[k.code]).toFixed(1),Number(s.ratings[k.code])>=3.1?'green':'amber')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="alertbox">Choose at least one supplier to compare.</div>'}<p class="small muted" style="margin-top:17px">The 3.1 reference is a benchmark indicator only; it is not an automatic approval for supplier selection or engagement.</p></section>`}
function interventions(s){let all=interventionMatches(s), filter=state.ui.interventionDomain||'ALL',list=all.filter(i=>filter==='ALL'||i.domain.includes(filter)),lead=all[0];return `<section class="panel"><div class="panel-head"><div><h2>Intervention planner</h2><p>Candidate options matched to demonstrated gaps and supplier business requirements. Select options for later human review.</p></div>${tag((s.selected||[]).length+' shortlisted','blue')}</div><div class="action-row" style="margin-bottom:19px"><label for="intervention-domain-filter" class="small" style="align-self:center;font-weight:700">Filter specialist domain:</label><select class="input small" id="intervention-domain-filter"><option value="ALL" ${filter==='ALL'?'selected':''}>All 21 candidates</option>${doms.map(d=>`<option value="${d.key}" ${filter===d.key?'selected':''}>${d.key} — ${d.name}</option>`).join('')}</select></div><div class="alertbox" style="margin-bottom:20px"><h4>Recommended starting point: ${lead?esc(lead.name):'Confirm diagnosis'}</h4><p>Matching is based on overlapping criteria, not a generative AI claim. Research case mechanisms and their scope limits still require specialist verification.</p></div><div class="interventions">${list.map((i,n)=>`<article class="intervention"><header><span class="kicker">CANDIDATE ${String(n+1).padStart(2,'0')}</span>${tag(i.overlap.length?'Matches '+i.overlap.join(', '):'Explore fit',i.overlap.length?'blue':'line')}</header><h3>${esc(i.name)}</h3><p>${esc(i.mechanism)}</p><div class="small" style="color:#8294a4"><strong>Evidence:</strong> ${esc(i.evidence_status||'Requires review')}<br><strong>Boundary:</strong> ${esc(i.boundary||'Scope to confirm')}</div><footer><span>${esc(i.reference||'Working benchmark research')}</span><label class="pill-check"><input type="checkbox" data-intervention="${esc(i.id)}" ${s.selected.includes(i.id)?'checked':''}> Shortlist</label></footer></article>`).join('')}</div><div class="action-row">${mkBtn('Validate the business case','workspace/economics')}</div></section>`}
function economics(s,f){const formFields=[['gain','Potential Siemens gain (€)','number'],['p_technical','P(technical success)','prob'],['p_on_time','P(on time)','prob'],['p_sustain','P(sustained)','prob'],['cost_experts','Siemens expert cost (€)','number'],['cost_travel','Travel & deployment (€)','number'],['cost_testing','Testing (€)','number'],['cost_tooling','Tooling support (€)','number'],['cost_incentives','Incentives (€)','number']];const supFields=[['supplier_capex','Supplier capital expenditure (€)'],['supplier_opex','Supplier operating cost (€)'],['supplier_contribution','Commercial/financial support (€)'],['retained_savings','Retained supplier savings (€)'],['productivity_relief','Productivity-ask relief (€)'],['other_customer_upside','Other customer upside (€)']];const pass=[{n:'Technical closure',ok:!!s.finance.tech_ok,sub:'Can the selected intervention actually close the gap?'},{n:'Timing & resources',ok:!!s.finance.timing_ok,sub:'Can the result arrive before the required date?'},{n:'Siemens economics',ok:f.econ,sub:'Is the expected value positive after the intervention cost?'},{n:'Supplier willingness',ok:s.finance.supplier_willing==='Yes',sub:s.finance.supplier_willing==='Yes with conditions'?'Conditional agreement requires further review.':'Will the supplier participate on acceptable terms?'}];let all=pass.every(x=>x.ok);return `<div class="cols-2"><div class="panel"><div class="panel-head"><div><h2>Siemens business case</h2><p>Change assumptions to recalculate expected value.</p></div></div><div class="form-grid">${formFields.map(([key,label,typ])=>`<div class="field"><label for="fin-${key}">${label}</label><input id="fin-${key}" class="input" type="number" min="0" ${typ==='prob'?'max="1" step="0.01"':'step="10000"'} data-fin="${key}" value="${esc(s.finance[key])}"></div>`).join('')}</div><div class="divider"></div><h3 class="subtle-head">Supplier economics</h3><div class="form-grid">${supFields.map(([key,label])=>`<div class="field"><label for="fin-${key}">${label}</label><input id="fin-${key}" class="input" type="number" min="0" step="10000" data-fin="${key}" value="${esc(s.finance[key])}"></div>`).join('')}</div><div class="action-row"><button class="btn btn-primary" data-action="recalculate">Recalculate & review →</button></div></div><div><section class="fiscal"><span class="eyebrow white">RISK-ADJUSTED EXPECTED NET VALUE</span><strong>${compact(f.net)}</strong><p>Based on ${euro(f.gain)} potential benefit, ${(f.p*100).toFixed(1)}% combined success probability and ${euro(f.cost)} Siemens costs.</p><div class="formula">Expected net = Potential gain × P(technical) × P(on-time) × P(sustained) − Siemens costs</div></section><section class="panel" style="margin-top:18px"><div class="panel-head"><div><h2>Feasibility gates</h2><p>All four must be reviewed by a responsible manager.</p></div>${tag(pass.filter(x=>x.ok).length+'/4 positive',pass.every(x=>x.ok)?'green':'amber')}</div><div class="gate-list">${pass.map((a,n)=>`<div class="gate"><div><strong>${n+1}. ${a.n}</strong><span>${a.sub}</span></div>${tag(a.ok?'Positive':'Open',a.ok?'green':'amber')}</div>`).join('')}</div><div class="divider"></div><div class="form-grid"><div class="field"><label for="gate-tech">Technical closure</label><select class="input" id="gate-tech" data-fin="tech_ok"><option value="true" ${s.finance.tech_ok?'selected':''}>Supported</option><option value="false" ${!s.finance.tech_ok?'selected':''}>Not confirmed</option></select></div><div class="field"><label for="gate-time">Timing feasibility</label><select class="input" id="gate-time" data-fin="timing_ok"><option value="true" ${s.finance.timing_ok?'selected':''}>Supported</option><option value="false" ${!s.finance.timing_ok?'selected':''}>Not confirmed</option></select></div><div class="field"><label for="gate-will">Supplier willingness</label><select class="input" id="gate-will" data-fin="supplier_willing">${['Yes','Yes with conditions','No'].map(x=>`<option ${s.finance.supplier_willing===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="divider"></div><div class="subtle-head">Supplier net economics</div><div class="metric-value" style="color:${f.sup>=0?'#1d6e5d':'#ad624c'}">${compact(f.sup)}</div><p class="small muted">Support + retained value + optional upside − supplier CapEx and OpEx. Illustrative, with inputs that need commercial validation.</p></section></div></div><section class="panel"><div class="panel-head"><div><h2>Human decision checkpoint</h2><p>Positive mathematics is not an automatic GO decision. Changes to assumptions reopen review.</p></div>${tag(s.reviewDecision==='Pending'?'Pending decision':s.reviewDecision,s.reviewDecision==='Approved'?'green':'amber')}</div><div class="form-grid"><div class="field"><label>Reviewer decision (demo only)</label><select class="input" id="review-decision"><option value="Pending" ${s.reviewDecision==='Pending'?'selected':''}>Pending</option><option value="Approved" ${s.reviewDecision==='Approved'?'selected':''}>Approve</option><option value="Hold" ${s.reviewDecision==='Hold'?'selected':''}>Hold for evidence</option><option value="Declined" ${s.reviewDecision==='Declined'?'selected':''}>Decline</option></select></div><div class="field" style="grid-column:span 2"><label>Reason / conditions</label><input class="input" id="review-note" value="${esc(s.reviewNote||'')}" placeholder="Document the approval basis or remaining conditions"></div></div><div class="action-row"><button class="btn btn-primary" data-action="saveDecision">Record demo decision</button>${!all?tag('Some feasibility gates remain open','amber'):tag('Four positive signals; verify evidence','blue')}</div></section>`}
function workflow(s){let done=Number(s.completed_stage||0);const desc=['Prioritize the trigger, impact and supplier criticality.','Validate gap diagnosis and evidence.','Select and tailor interventions with specialist oversight.','Test feasibility, economics, supplier incentives and timing.','Agree the charter, accountabilities and delivery dates.','Deliver improvements with supplier ownership.','Verify impact against the evidence baseline.','Close the record and capture lessons learned.'];return `<section class="panel"><div class="panel-head"><div><h2>Eight-stage delivery</h2><p>Record milestone evidence in your browser. Human approvals are separate from automated suggestions.</p></div>${tag(done+' / 8 recorded','blue')}</div><div class="workflow-grid">${stageNames.map((name,i)=>`<div class="stage-box"><div class="ball">${i+1}</div><div><h3>${name}</h3><p>${desc[i]}</p><textarea class="input" style="margin-top:11px;min-height:60px" data-note="${i+1}" placeholder="Evidence / owner / milestone">${esc((s.workflowNotes||{})[String(i+1)]||'')}</textarea><button class="btn btn-outline btn-small" data-stage="${i+1}">${i+1<=done?'Review recorded':'Record stage complete'}</button></div></div>`).join('')}</div></section>`}
function questionnaire(s){let qs=D.criteria;let answered=Object.values(s.questionnaire||{}).filter(x=>x!=null&&x!=='').length;return `<section class="panel"><div class="panel-head"><div><h2>Supplier evidence questionnaire</h2><p>A 16-question demonstration checklist—one per project capability criterion.</p></div>${tag(answered+' / '+qs.length+' answered','blue')}</div><div class="integration-note" style="margin-bottom:22px">The original 55-rated-item supplier questionnaire is a separate source with seven categories. It is <strong>not included in this public demo</strong> and cannot be treated as mathematically equivalent to these 16 capability ratings without validation.</div><div class="question-grid">${qs.map(q=>`<div class="question"><strong>${q.code}</strong><label for="q-${q.code}">How effectively does this supplier demonstrate ${esc(q.name.toLowerCase())}?</label><select class="input" id="q-${q.code}" data-question="${q.code}"><option value="">Not answered</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(s.questionnaire[q.code])===n?'selected':''}>${n} / 5</option>`).join('')}</select></div>`).join('')}</div><div class="action-row"><button class="btn btn-outline" data-action="resetQuestions">Clear these responses</button>${mkBtn('View capability assessment','workspace/assessment')}</div></section>`}
function dataView(s){let mock=D.mock.suppliers.find(x=>x.supplier_id===s.id);return `<section class="panel"><div class="panel-head"><div><h2>Data foundation & Snowflake</h2><p>Four proposed data domains, shown here with a complete synthetic snapshot for ${esc(s.name)}.</p></div>${tag('Mock records only','amber')}</div><div class="integration-note" style="margin-bottom:20px">No live Snowflake credentials, Siemens datasets, or supplier-sensitive records are embedded in this website. Production access needs approved views, security filters, permissions, service identity and monitoring.</div><div class="integration-grid">${dataSrc.map((x,i)=>{const record=mock?.[x.field]||{};return `<div class="source-card"><span class="eyebrow">DATASET 0${i+1}</span><h3>${x.title}</h3><p>${x.desc}</p><code>${x.id}</code><div class="divider" style="margin:13px 0"></div>${Object.entries(record).slice(0,5).map(([k,v])=>`<div class="keyline" style="grid-template-columns:1fr 1fr"><dt>${esc(k.replaceAll('_',' '))}</dt><dd>${esc(v==null?'Not available':v)}</dd></div>`).join('')||'<p>No demo record</p>'}</div>`}).join('')}</div><div class="action-row">${mkBtn('See the Copilot integration plan','workspace/copilot','btn-outline')}</div></section>`}
function botAnswer(msg,s){let t=msg.toLowerCase(), f=calc(s), g=weak(s), mi=interventionMatches(s)[0];if(/snowflake|data|risk source/.test(t))return `This demo has four synthetic Snowflake-aligned records: supplier risk, performance, evaluation and relationship management. There is no live data connection. Open the Snowflake data tab to inspect the exact mock values for ${s.name}.`;
if(/business|finance|cost|return|economic|profit|value|roi|investment/.test(t))return `For ${s.name}, illustrative expected net value is ${compact(f.net)}: ${euro(f.gain)} potential gain × ${pct(f.p)} combined success probability − ${euro(f.cost)} Siemens costs. Supplier net economics are ${compact(f.sup)}. This is not an approved financial business case.`;
if(/copilot|agent|ai/.test(t))return `The three specialist perspectives are future readiness, production systems and resilience. The public website runs transparent deterministic logic. Siemens Copilot Studio would need a secured API tool and approved data connections to become the real employee-facing assistant.`;
if(/compare/.test(t))return `Use Compare suppliers to select any three fictional cases, then review all 16 criteria. Missing evidence is displayed explicitly and never set to zero.`;
if(/risk|weak|gap|problem/.test(t))return `${s.name} has ${g.length} assessed criteria below the 3.1 benchmark: ${g.slice(0,5).map(x=>x.code+' '+x.name+' ('+Number(s.ratings[x.code]).toFixed(1)+')').join('; ')||'none identified'}. ${missing(s).length} criteria are unassessed. A maturity benchmark does not decide suitability.`;
if(/recommend|intervention|solution|support|improv/.test(t))return `Top research-derived candidate: ${mi?.name||'No match'}. Mechanism: ${mi?.mechanism||'No scoped intervention yet'}. Matched criteria: ${mi?.overlap.join(', ')||'none'}. Verify the source boundary and supplier context before approval.`;
return `For ${s.name}, the key task is to confirm the capability evidence and choose a scoped intervention. The case trigger is: ${s.trigger}. You can ask about risks, recommendations, economics, supplier comparison or Snowflake data.`}
function copilot(s){let chats=state.chat.filter(x=>x.sid===s.id);return `<div class="cols-2"><section class="panel"><div class="panel-head"><div><h2>Copilot Studio integration</h2><p>Deployment concept for an authenticated Microsoft environment.</p></div>${tag('Not connected','amber')}</div><div class="integration-note">This public site cannot securely call Siemens Copilot or Snowflake on its own. The integration requires a protected server API, identity, authorized data views and Copilot Studio deployment.</div><div class="divider"></div>${[['Coordinator','Routes the supplier question and checks data context.'],['Readiness specialist','Analyzes future capacity, ramp-up and complexity criteria A1–A5.'],['Production specialist','Analyzes process stability, flow, quality and routines B1–B7.'],['Resilience specialist','Analyzes dependencies, continuity and volatility C1–C4.'],['Human reviewer','Approves scoped interventions and investment commitments.']].map(([a,b])=>`<div class="keyline" style="grid-template-columns:145px 1fr"><dt>${a}</dt><dd>${b}</dd></div>`).join('')}<div class="action-row">${mkBtn('Inspect data sources','workspace/data','btn-outline')}</div></section><section class="panel"><div class="panel-head"><div><h2>Try the decision assistant</h2><p>Local rule-based responses; not connected to Copilot.</p></div>${tag('Rule-based demo','line')}</div><div class="chat-panel"><div class="chat-messages" id="chat-messages">${(chats.length?chats:[{role:'bot',text:'Ask about capability gaps, recommendations, the business case, data sources or Copilot integration.'}]).map(m=>`<div class="chat-message ${m.role}">${esc(m.text)}</div>`).join('')}</div><form id="chat-form" class="chat-input"><input id="chat-question" class="input" aria-label="Ask a question" placeholder="e.g. What are the biggest capability gaps?" required><button class="btn btn-primary" type="submit">Ask →</button></form></div><div class="action-row"><button class="btn btn-ghost" data-ask="Which intervention should we consider?">Suggested question</button><button class="btn btn-ghost" data-ask="Explain the business case">Explain economics</button></div></section></div>`}
async function askBackend(question){
  const sid=c().id;
  state.chat.push({role:'user',sid,text:question});save();render();
  try{
    const resp=await fetch('/api/assistant',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({supplier_id:sid,message:question})});
    if(!resp.ok)throw new Error('Assistant endpoint returned '+resp.status);
    const data=await resp.json();
    state.chat.push({role:'bot',sid,text:data.answer});
  }catch(err){state.chat.push({role:'bot',sid,text:'The backend could not respond. Please reconnect and try again.'});console.error(err);}
  save();render();const m=$('chat-messages');if(m)m.scrollTop=m.scrollHeight;
}
function render(){let key=decodeURI((location.hash||'#home').slice(1));const[page,tab]=key.split('/');const title=page==='workspace'?'Workspace · '+tabLabels[tab||'overview']:page.charAt(0).toUpperCase()+page.slice(1);document.title=`${title} | Supplier Capability Hub`;const pageMap={home:homepage,solutions,approach,technology};$('app').innerHTML=header()+(page==='workspace'?workspace(ids.includes(tab)?tab:'overview'):(pageMap[page]||homepage)())+footer();document.querySelectorAll('.nav-link').forEach(el=>el.classList.toggle('active',el.dataset.link===page));const menu=$('menu-toggle');if(menu)menu.onclick=()=>{$('site-nav').classList.toggle('mobile-open')};window.scrollTo({top:0,behavior:'auto'});}
function toast(s){const old=$('toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.id='toast';el.textContent=s;document.body.appendChild(el);setTimeout(()=>el.remove(),3100)}
function updateStateAndRepaint(){save();render()}
window.addEventListener('hashchange',render);
document.addEventListener('click',ev=>{let go=ev.target.closest('[data-go]');if(go){location.hash=go.dataset.go;return}let ac=ev.target.closest('[data-action]');if(ac){const type=ac.dataset.action;if(type==='export'){const blob=new Blob([JSON.stringify({format:'SUPPLIER-HUB-DEMO-CASE-v1',case:c()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='supplier-capability-'+c().id.toLowerCase()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Case exported as JSON')}
else if(type==='resetScores'){if(confirm('Reset the 16 capability ratings for this synthetic case?')){let orig=D.cases.find(x=>x.id===c().id);c().ratings=copy(orig.ratings);c().reviewDecision='Pending';c().reviewNote='';updateStateAndRepaint();toast('Original demonstration scores restored')}}
else if(type==='resetQuestions'){c().questionnaire={};updateStateAndRepaint();toast('Demo questionnaire cleared')}
else if(type==='recalculate'){c().reviewDecision='Pending';c().reviewNote='';updateStateAndRepaint();toast('Case recalculated; prior decision reopened')}
else if(type==='saveDecision'){let v=$('review-decision').value;let note=$('review-note').value.trim();if(v!=='Pending'&&!note){toast('Please enter a decision reason');return}let f=calc(c());if(v==='Approved'&&(!c().finance.tech_ok||!c().finance.timing_ok||!f.econ||c().finance.supplier_willing!=='Yes')){toast('Approval blocked: resolve all feasibility gates');return}c().reviewDecision=v;c().reviewNote=note;updateStateAndRepaint();toast('Demo review decision recorded')}}
let st=ev.target.closest('[data-stage]');if(st){const n=Number(st.dataset.stage);c().completed_stage=Math.max(Number(c().completed_stage||0),n);updateStateAndRepaint();toast('Stage '+n+' recorded in this browser')}
let ask=ev.target.closest('[data-ask]');if(ask){askBackend(ask.dataset.ask)}
});
document.addEventListener('change',async ev=>{let el=ev.target;
if(el.id==='restore-session-file'){
  const file=el.files?.[0];if(!file)return;
  if(file.size>400000){toast('Backup is too large');return;}
  try{
    const json=JSON.parse(await file.text());
    if(!confirm('Restore these demonstration records? Existing edits in this browser session will be replaced and approvals reset.'))return;
    await saveQueue;
    const response=await fetch('/api/import',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(json)});
    if(!response.ok)throw new Error((await response.json().catch(()=>({detail:'Invalid backup'}))).detail);
    const data=await response.json();state=recoverState(data.state);backendEvaluations=data.evaluations||{};render();toast('Backup restored · approvals reset');
  }catch(error){toast('Could not restore backup: '+String(error.message).slice(0,75));}
  return;
}if(el.id==='intervention-domain-filter'){state.ui.interventionDomain=el.value;updateStateAndRepaint();return}if(el.id==='supplier-select'){state.activeId=el.value;updateStateAndRepaint();return}if(el.dataset.score){c().ratings[el.dataset.score]=el.value===''?null:Number(el.value);c().reviewDecision='Pending';c().reviewNote='';updateStateAndRepaint();toast('Assessment updated · review reopened');return}if(el.dataset.compare){const id=el.dataset.compare;if(el.checked){if(state.compare.length>=3){toast('Select no more than three suppliers');el.checked=false;return}state.compare.push(id)}else state.compare=state.compare.filter(x=>x!==id);updateStateAndRepaint();return}if(el.dataset.intervention){const id=el.dataset.intervention;const set=new Set(c().selected);if(el.checked)set.add(id);else set.delete(id);c().selected=[...set];c().reviewDecision='Pending';c().reviewNote='';save();toast('Shortlist saved · review reopened');return}if(el.dataset.fin){let k=el.dataset.fin,v=el.value;if(k==='tech_ok'||k==='timing_ok')v=v==='true';else if(k==='supplier_willing'){}else{v=Number(v);if(!Number.isFinite(v)||v<0)v=0;if(k.startsWith('p_'))v=Math.max(0,Math.min(1,v))}c().finance[k]=v;c().reviewDecision='Pending';c().reviewNote='';updateStateAndRepaint();toast('Assumptions updated · review reopened');return}if(el.dataset.note){c().workflowNotes[el.dataset.note]=el.value;save();return}if(el.dataset.question){c().questionnaire[el.dataset.question]=el.value===''?null:Number(el.value);updateStateAndRepaint();return}});
document.addEventListener('input',ev=>{if(ev.target.dataset.note){c().workflowNotes[ev.target.dataset.note]=ev.target.value;save()}});
document.addEventListener('submit',ev=>{if(ev.target.id==='chat-form'){ev.preventDefault();let q=$('chat-question').value.trim();if(!q)return;askBackend(q)}});
if(!location.hash)location.hash='home';
async function startApplication(){
  const mount=document.getElementById('app');
  if(mount)mount.innerHTML='<main class="container" style="padding:65px 28px;min-height:52vh"><h1 style="font-size:30px">Supplier Capability Hub</h1><p style="margin-top:12px">Loading the supplier workspace from the server…</p></main>';
  try{
    const response=await fetch('/api/bootstrap',{credentials:'same-origin',cache:'no-store'});
    if(!response.ok)throw new Error('Server returned '+response.status);
    const result=await response.json();
    if(!result.state?.cases?.length)throw new Error('The server did not return supplier records');
    state=recoverState(result.state);
    backendEvaluations=result.evaluations||{};
    backendReady=true;
    render();
  }catch(err){console.error('Unable to connect to Python backend',err);
    if(mount)mount.innerHTML='<main class="container" style="padding:80px 28px;min-height:50vh"><h1 style="font-size:30px">Cannot reach the supplier backend</h1><p style="margin-top:15px">This website must be opened from the running Python server. Start the server locally or use the hosted web-service URL.</p><p style="margin-top:15px">'+esc(err.message)+'</p><p style="margin-top:20px"><button class="btn btn-primary" onclick="location.reload()">Retry connection</button></p></main>';
  }
}
try{startApplication()}catch(error){
  console.error('Supplier Capability Hub could not initialize:',error);
  const mount=document.getElementById('app');
  if(mount)mount.innerHTML='<main class="container" style="padding:65px 28px"><h1 style="font-size:28px">The workspace could not load</h1><p style="margin:15px 0 22px">An older browser session may be incompatible with this version.</p><p><a href="?reset=1#home" style="color:#63358e;font-weight:bold">Reset the demo session and reload</a></p><p style="margin-top:12px;font-size:13px;color:#6b6277">Resetting clears only saved demonstration changes in this browser.</p></main>';
}

</script></body></html>
