services:
  - type: web
    name: supplier-capability-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: REQUIRE_AUTH
        value: "1"
      - key: APP_USERNAME
        value: "supplier-demo"
      - key: APP_PASSWORD
        sync: false
